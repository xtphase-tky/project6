name: deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force docker rebuild or not"
        required: false
        default: false
        type: boolean

env:
  DEPLOY_PATH: /opt/app

jobs:
  build-push:
    name: build and push image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.export.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker buildx setup
        uses: docker/setup-buildx-action@v3

      - name: build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/your-app:${{ github.sha }}
          no-cache: ${{ inputs.force_rebuild }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: export image uri
        id: export
        run: |
          echo "image_uri=${{ secrets.DOCKERHUB_USERNAME }}/your-app:${{ github.sha }}" \
          >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy to production server
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: prod

    steps:
      - uses: actions/checkout@4

      - name: add known host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: blue-green deployment
        env:
          IMAGE_URI: ${{ needs.build-push.outputs.image_uri }}
          DB_URL: ${{ secrets.PROD_DATABASE_URL }}

        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_URI, DB_URL
          script: |
            set -euo pipefail

            cd ${{ env.DEPLOY_PATH }}

            docker pull $IMAGE_URI

            docker stop app-green || true
            docker rm app-green || true

            echo "Starting GREEN deployment..."
            docker run -d \
              --name app-green \
              --env DB_URL=$DB_URL \
              -p 8081:8080 \
              $IMAGE_URI

            echo "Waiting for green health check..."
            sleep 10

            if ! curl -f http://localhost:8081/health; then
               echo "GREEN deployment failed. Rolling back immediately."
               docker stop app-green || true
               docker rm app-green || true
               exit 1
            fi

            echo "GREEN is healthy. Switching traffic..."
            docker stop app-green
            docker rm app-green
            
            # Backup current blue state before replacing
            docker rename app-blue app-blue-old || true 

            echo "Starting BLUE on production port..."
            docker run -d \
              --name app-blue \
              -p 8080:8080 \
              --env DB_URL=$DB_URL \
              $IMAGE_URI

            sleep 10

            echo "Verifying production health..."
            if ! curl -f http://localhost:8080/health; then
              echo "NEW BLUE FAILED. Rolling back..."

              docker stop app-blue || true
              docker rm app-blue || true

              # Restore old version
              docker rename app-blue-old app-blue

              docker start app-blue
              
                exit 1
            fi

            echo "Cleaning up old version..."
            docker stop app-blue-old || true

            echo "Deployment successful with zero-downtime + rollback protection"
